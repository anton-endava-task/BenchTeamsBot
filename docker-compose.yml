services:
  postgres:
    image: postgres:16
    container_name: bench-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: benchbot
      POSTGRES_PASSWORD: benchbot
      POSTGRES_DB: benchbot
    ports:
      - "5432:5432"
    volumes:
      - benchbot_postgres_data:/var/lib/postgresql/data

volumes:
  benchbot_postgres_data:
